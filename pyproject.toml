[project]
name = "llm_literary_coref"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.1",
    "intervaltree>=3.1.0",
    "more-itertools>=10.8.0",
    "natsort>=8.4.0",
    "numpy>=2.3.5",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.4",
    "scipy>=1.16.3",
    "torch>=2.9.1",
    "transformers>=4.57.2",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["llm_literary_coref"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
